<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project detail, phase 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:#5A4A99}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid #5A4A99;outline-offset:2px}
[id]{scroll-margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;min-height:100%;background:#F3F4F8;color:#272B3F;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.side{flex:0 0 248px;background:#FFFFFF;border-right:1px solid #E3E5EE}
.side-in{position:sticky;top:0;box-sizing:border-box;height:100vh;overflow-y:auto;padding:28px 16px;display:flex;flex-direction:column;gap:24px}
.main{flex:1 1 0;min-width:0;box-sizing:border-box;padding:40px 56px 64px;display:flex;flex-direction:column;gap:32px}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#434A5E;box-sizing:border-box;min-height:44px}
.nav-link:hover{background:#F3F4F8;color:#272B3F}
.nav-link[aria-current="page"]{background:#ECE8F8;color:#4A3B87;font-weight:500}
.sec-link{display:flex;align-items:center;min-height:36px;padding:0 12px;border-radius:8px;color:#5C6178;font-size:13px}
.sec-link:hover{background:#F3F4F8;color:#272B3F}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#5A4A99;color:#FFFFFF;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.card{box-sizing:border-box;padding:28px;border-radius:20px;background:#FFFFFF;border:1px solid #E3E5EE}
.h1{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:40px;line-height:1.15;letter-spacing:-0.01em}
.h2{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25}
.h3{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:20px;line-height:1.25}
.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid #C9CDD8;background:#FFFFFF;color:#272B3F;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:#F8F9FC;color:#272B3F}
.btn-primary,.btn-primary:hover{border-color:#5A4A99;background:#5A4A99;color:#FFFFFF}
.btn-primary:hover{background:#4A3B87}
.field{box-sizing:border-box;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #C9CDD8;background:#F8F9FC;color:#272B3F;font-size:14px}
.opt{display:flex;align-items:flex-start;gap:12px;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid #E3E5EE;min-height:44px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:14px 12px;border-radius:12px;min-height:44px;box-sizing:border-box}
.row:hover{background:#F3F4F8;color:#272B3F}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;min-width:1060px}
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:center;padding:96px 16px 16px;background:rgba(39,43,63,0.45);overflow-y:auto}
.dialog{width:100%;max-width:520px;box-sizing:border-box;padding:28px;border-radius:20px;background:#FFFFFF;display:flex;flex-direction:column;gap:18px}
.topbar,.chips,.tabbar{display:none}
@media (max-width:1100px){.main{padding:32px 32px 56px}}
@media (max-width:899px){
.app{flex-direction:column}
.side{display:none}
.main{padding:20px 16px 32px;gap:24px}
.topbar{display:flex;position:sticky;top:0;z-index:20;box-sizing:border-box;min-height:56px;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;background:#FFFFFF;border-bottom:1px solid #E3E5EE}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0}
.chips a{flex:none;display:inline-flex;align-items:center;box-sizing:border-box;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #C9CDD8;background:#FFFFFF;color:#434A5E;font-size:13px;font-weight:500;white-space:nowrap}
.tabbar{display:flex;position:sticky;bottom:0;z-index:20;gap:4px;padding:4px 8px;background:#FFFFFF;border-top:1px solid #E3E5EE}
.tabbar a{flex:1 1 0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;font-size:11px;font-weight:500;color:#434A5E}
.tabbar a[aria-current="page"]{background:#ECE8F8;color:#4A3B87}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 4px);margin:0}
.card{padding:20px;border-radius:16px}
.dialog{padding:20px;border-radius:16px}
.overlay{padding-top:48px}
.h1{font-size:30px}
.h2{font-size:22px}
.hide-sm{display:none !important}
.board{grid-template-columns:repeat(5,272px);min-width:0}
[id]{scroll-margin-top:72px}
}
</style>
</helmet>
<dc-import name="Project" phase="one" hint-size="100%,1900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
